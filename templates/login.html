{% extends "base.html" %}
{% block body %}
<main class="login">
  <form method="post" class="card">
    <h1>Senus PLC</h1>
    <p class="muted">Board Report</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <label>Email <input name="email" type="email" value="ceo@senus.com" required></label>
    <label>Password <input name="password" type="password" required></label>
    <button type="submit">Sign in</button>
    <p class="muted small">Demo login: ceo@senus.com / boardreport</p>
  </form>
</main>
{% endblock %}
